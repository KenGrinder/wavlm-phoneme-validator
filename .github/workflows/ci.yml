name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install --upgrade pip
      # fastapi and python-multipart are the only runtime deps the route tests need.
      # Everything heavier is stubbed, which is what keeps this job under a minute.
      - run: python -m pip install -r requirements-test.txt fastapi==0.141.1 python-multipart==0.0.32
      - run: python -m ruff check app tests scripts
      - run: python -m compileall -q app scripts
      - run: python scripts/validate_templates.py
      - name: Validate Docker Compose examples
        run: |
          docker compose -f compose.gpu.yaml config --quiet
          docker compose -f compose.cpu.yaml config --quiet
      - run: python -m pytest

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Free runner disk space
        # A CUDA base plus a 1.2 GB checkpoint fills the default runner otherwise.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force
      - uses: docker/setup-buildx-action@v3
      - name: Build the CPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cpu
          platforms: linux/amd64
          push: false
          load: true
          tags: wavlm-phoneme-validator:ci
          build-args: |
            VERSION=ci
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
      - name: Run the tests inside the image
        # This is where test_table_matches_import stops skipping: with torch present it
        # asserts the ARPABET table parsed out of the vendored file is the one the
        # scorer actually uses. A drift there would silently mis-map every phone.
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/tests:/srv/tests:ro" \
            -v "${{ github.workspace }}/pyproject.toml:/srv/pyproject.toml:ro" \
            -e PYTHONPATH=/srv \
            wavlm-phoneme-validator:ci \
            sh -c "pip install --quiet pytest httpx && python -m pytest /srv/tests -q"
      - name: Smoke-test the service
        run: |
          docker run -d --name wavlm-ci -p 8000:8000 -e WAVLM_PRELOAD_MODELS=0 \
            wavlm-phoneme-validator:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/v1/health
          curl -fsS http://127.0.0.1:8000/api/v1/info
          # 503 until the weights load is the contract, so assert the code, not the body.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/ready)" = "503"
          docker rm -f wavlm-ci
