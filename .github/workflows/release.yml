name: Release Container

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      # Sequential, not parallel: both variants build torch layers and two runners
      # racing on the same GHA cache scope thrash it.
      max-parallel: 1
      matrix:
        include:
          - variant: gpu
            dockerfile: Dockerfile
          - variant: cpu
            dockerfile: Dockerfile.cpu
    steps:
      - uses: actions/checkout@v5

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # `gpu` and `cpu` float to the newest release of each variant, which is what
          # the Unraid template points at; the version-suffixed tags are what you pin to
          # when a score has to stay comparable across a redeploy.
          tags: |
            type=raw,value=${{ matrix.variant }}
            type=semver,pattern={{version}},suffix=-${{ matrix.variant }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.variant }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: wavlm-release:test
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=min
      - name: Regression tests in the built image
        run: |
          docker run --rm --user 0 -e WAVLM_PRELOAD_MODELS=0 \
            -v "${{ github.workspace }}/tests:/srv/tests:ro" \
            -v "${{ github.workspace }}/pyproject.toml:/srv/pyproject.toml:ro" \
            wavlm-release:test sh -c 'pip install --quiet pytest httpx && python -m pytest /srv/tests'
      - name: Smoke-test with the Unraid permissions
        run: bash scripts/smoke-container.sh wavlm-release:test
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=min
